aid: bruce
name: Bruce
description: 'Bruce is a curated professional intro network for licensed real estate,
  mortgage, title & escrow, and insurance professionals, built by Tanda Technologies,
  Inc. and founded by Jesse Chor. Rather than a directory, review site, or CRM, Bruce
  verifies each member''s license and role, then lets them log intros and build a
  portable, verifiable track record. The Bruce Card is each member''s living profile
  — stats, deals, intros, and market rank — that replaces the resume and the "trust
  me" claim with a sharable credential. Bruce also runs an AI-hosted editorial publication
  at blog.bruce.bot that profiles verified members in interview-style stories. Backed
  by Initialized Capital; surfaced into the API Evangelist network as a portfolio company.'
